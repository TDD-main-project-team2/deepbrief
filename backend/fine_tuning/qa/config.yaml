# QA 파인튜닝 데이터셋 구성 설정
#
# 원본(AI Hub 뉴스 기사 기계독해 데이터)은 용량(GitHub 100MiB 파일 제한) 때문에 레포 밖에 둔다.
# 가공 결과는 기본적으로 qa/data/processed 에 저장한다.

paths:
  # 원본 json 폴더 (Training/, Validation/ 하위 폴더를 포함한 경로)
  # null 이면 환경변수 FT_RAW_DIR 를 사용한다. (개인 PC 경로를 레포에 올리지 않기 위해 기본은 null)
  raw_dir: null
  # 가공 결과 폴더. null 이면 이 파일 옆의 data/processed 를 사용한다.
  processed_dir: null

dataset:
  # 데이터셋별 크기 (기사 1건당 질문 1개이므로 기사 수 = 질문 수)
  split_sizes:
    training: 20000
    validation: 2000
    golden: 400
  # 유형별 비율 (세 데이터셋 공통, 합계 1.0)
  type_ratio:
    span_extraction: 0.70   # 추출형
    span_inference: 0.10    # 추론형
    text_entailment: 0.15   # Yes/No 단문형
    unanswerable: 0.05      # 응답불가형
  # Yes/No 단문형에서 '예'가 차지할 비율
  yes_ratio: 0.5
  # 기사 1건에서 사용할 질문 수 (원본은 바꿔 말한 질문 2개)
  questions_per_doc: 1
  # Training 구간 크기. 모든 구간에서 유형·예/아니오 비율이 같도록 순서를 배치한다.
  # (batch size 16 x 검증 간격 250배치 = 4,000건)
  chunk_size: 4000
  # Golden을 분야별로 고르게 뽑을 때 기준 필드 (원본 doc_class.code)
  golden_stratify_field: code
  # 재현 가능한 샘플링을 위한 랜덤 시드
  random_seed: 42

answers:
  unanswerable: "주어진 기사에서 답을 찾을 수 없습니다."
  "yes": "예"
  "no": "아니오"

normalization:
  # 본문·질문·답·근거에서 제거할 목록 기호
  remove_symbols: ["△", "▲", "◆"]
