model:
  name: Qwen/Qwen3-1.7B
  max_sequence_length: 1400
  dtype: float16

dataset:
  train_path: data/processed/training_dataset.json
  validation_path: data/processed/validation_dataset.json
  golden_path: data/processed/golden_dataset.json
  train_size: 20000
  validation_size: 2000
  golden_size: 400

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: float16

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  bias: none
  task_type: CAUSAL_LM

training:
  epochs: 1
  batch_size: 1
  learning_rate: 0.0002
  gradient_accumulation_steps: 16
  logging_steps: 10
  optim: paged_adamw_8bit
  gradient_checkpointing: true
  fp16: false
  bf16: false
  max_grad_norm: 1.0
  dataloader_pin_memory: false
  report_to: none
  resume_from_checkpoint: null
  completion_only_loss: true
  disable_tqdm: false

checkpoint:
  output_dir: checkpoints
  save_strategy: steps
  save_steps: 50
  save_total_limit: null

evaluation:
  strategy: steps
  eval_steps: 50
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false

output:
  best_adapter_dir: adapters/best

generation:
  max_new_tokens: 150