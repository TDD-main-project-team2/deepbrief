model:
  name: "Qwen/Qwen3-1.7B"
  dtype: float16

data:
  train_path: data/processed/training_dataset.json
  validation_path: data/processed/validation_dataset.json
  sample_limit: 400 # null이면 전체 학습 데이터 사용
  validation_sample_limit: null # null이면 전체 검증 데이터 사용
  max_sequence_length: 2048

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: float16

lora:
  rank: 8
  alpha: 32
  dropout: 0.1
  target_modules: [q_proj, v_proj]
  bias: none

training:
  output_dir: qlora-output
  resume_from_checkpoint: null # 저장된 체크포인트에서 학습을 이어갈지 정하는 옵션
  batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  epochs: 1
  max_steps: -1 # -1이면 epochs 적용, 양수이면 해당 스텝 수 우선
  logging_steps: 1
  save_strategy: epoch
  save_total_limit: 2
  optim: adamw_torch
  gradient_checkpointing: true
  dataloader_pin_memory: false
  report_to: none

evaluation:
  strategy: epoch
  eval_steps: 500 # strategy가 steps일 때 적용
  load_best_model_at_end: false
  metric_for_best_model: eval_loss
  greater_is_better: false

generation:
  max_new_tokens: 150
  do_sample: false
